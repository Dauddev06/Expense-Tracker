# Docker names the database volume after this project name
# ("learning_nestjs_pgdata"). It was the folder's old name: keeping it here
# means the existing local database is still used after the folder rename.
name: learning_nestjs

services:
  db:
    image: postgres:17-alpine
    container_name: spendings-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: spender
      POSTGRES_PASSWORD: spender_pass
      POSTGRES_DB: spendings_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spender -d spendings_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer
    container_name: spendings-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - db

volumes:
  pgdata:
